version: 2

updates:
  # The publish workflow pins pypa/gh-action-pypi-publish to a commit SHA, which
  # is the form the action's maintainers recommend but which never updates on its
  # own. Dependabot bumps the SHA and rewrites the version comment beside it, so
  # the pin stays current without anyone having to remember it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
