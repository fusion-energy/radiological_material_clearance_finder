name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Builds on every push and pull request, so a broken link or a docstring
    # that no longer resolves fails here rather than reaching the site.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Not the test matrix. The package supports 3.9, but mkdocstrings 1.0 and
      # mkdocstrings-python 2.0 dropped it, so the docs toolchain needs 3.10 or
      # newer regardless of what the package itself supports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .

      # --strict turns warnings into failures, and the validation block in
      # mkdocs.yml promotes broken anchors and omitted files to warnings, so a
      # dead cross-reference cannot be published.
      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # GitHub Pages needs a paid plan for a private repository, and this one is
    # private on a free organisation, so deployment is skipped until the repo is
    # public. Left as a condition rather than deleted: the build job above still
    # proves the docs are sound on every change, and this starts working the
    # moment the repository becomes public, with no edit needed here.
    #
    # actions/configure-pages is deliberately absent. It fails hard when Pages
    # is not enabled, and MkDocs does not need it: it only rewrites configs for
    # Next, Nuxt, Gatsby and SvelteKit. site_url is set in mkdocs.yml instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
