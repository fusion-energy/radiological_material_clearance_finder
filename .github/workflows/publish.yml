name: publish

on:
  release:
    types: [published]
  # A manual run builds and tests the artifacts but never uploads them, so the
  # whole release path can be rehearsed. Only a published release publishes.
  workflow_dispatch:

# Nothing is granted by default, each job asks for exactly what it needs.
permissions: {}

concurrency:
  # Serialise runs. Two uploads racing for the same version would leave PyPI in
  # a half published state, and neither PyPI nor crates.io ever lets a version
  # be uploaded twice.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    # One version for the crate and the wheel, read from the workspace
    # Cargo.toml, which maturin also reads. On a release the tag has to agree
    # with it, and it must not already be on PyPI or crates.io.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read and check the version
        id: read
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          with open("Cargo.toml", "rb") as handle:
              version = tomllib.load(handle)["workspace"]["package"]["version"]
          print(f"workspace version {version}")

          tag = os.environ.get("RELEASE_TAG", "")
          if tag and tag.lstrip("v") != version:
              print(
                  f"::error::release tag {tag} does not match the version in "
                  f"Cargo.toml, expected v{version}. Either bump the version or retag"
              )
              sys.exit(1)

          # Both registries refuse a version they have already seen, permanently.
          # Failing here is a clear message instead of an upload error after the
          # wheels have been built. Being unable to ask is not a reason to stop,
          # since the registries reject a duplicate anyway.
          checks = {
              "PyPI": f"https://pypi.org/pypi/radiological-material-clearance-finder/{version}/json",
              "crates.io": f"https://crates.io/api/v1/crates/radiological-material-clearance-finder/{version}",
          }
          taken = []
          for registry, url in checks.items():
              request = urllib.request.Request(
                  url, headers={"User-Agent": "radiological-material-clearance-finder release check"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      response.read()
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"{version} is not on {registry}, good to publish")
                      continue
                  print(f"::warning::could not check {registry}, HTTP {error.code}")
                  continue
              except OSError as error:
                  print(f"::warning::could not reach {registry}: {error}")
                  continue
              taken.append(registry)
          if taken:
              print(
                  f"::error::{version} is already on {' and '.join(taken)}. A version "
                  "can never be re-uploaded, so bump [workspace.package] version in "
                  "Cargo.toml and make a new release"
              )
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
          PY

  sdist:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/
          if-no-files-found: error

  wheels:
    # abi3, so one wheel per platform covers CPython 3.10 and every later
    # version, and no Python matrix is needed here.
    needs: [version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-13, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  check:
    # Metadata, and that every artifact carries the version the version job
    # read, since a stale build cache is the one way they could disagree.
    needs: [version, sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*
      - name: Check the artifact versions
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import sys

          version = os.environ["VERSION"]
          entries = sorted(glob.glob("dist/*"))
          print("\n".join(entries))
          wheels = [e for e in entries if e.endswith(".whl")]
          sdists = [e for e in entries if e.endswith(".tar.gz")]
          if len(sdists) != 1 or len(wheels) != 5 or len(entries) != 6:
              print(f"::error::expected one sdist and five wheels, found {entries}")
              sys.exit(1)
          wrong = [
              e for e in entries
              if os.path.basename(e).split("-")[1].removesuffix(".tar.gz") != version
          ]
          if wrong:
              print(f"::error::these artifacts are not version {version}: {wrong}")
              sys.exit(1)
          PY

  test:
    # The same suite test.yml runs, from the sdist against the installed Linux
    # wheel, so this tests the artifacts that would be published rather than
    # the source tree they were built from.
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the built wheel
        run: python -m pip install --only-binary :all: --find-links dist/ "radiological-material-clearance-finder[test]"

      - name: Unpack the sdist
        run: |
          mkdir sdist
          tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          # The python/ source tree has no compiled extension, so it must not
          # shadow the installed wheel.
          rm -rf sdist/python

      # The package has no runtime dependencies, so this proves it stands alone.
      - name: Test without OpenMC
        working-directory: sdist
        run: pytest -q

  publish-pypi:
    # Trusted publishing, so there is no API token anywhere. PyPI checks the OIDC
    # token against a publisher registered for this repository and this filename,
    # which is why publish.yml must not be renamed.
    if: github.event_name == 'release'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      # Set on this job rather than at the top of the file so that no job which
      # runs project code can mint an OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      # Pinned to a commit SHA with the tag it belongs to in the comment.
      # Dependabot reads the comment when it bumps this.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: false
          attestations: true

  publish-crate:
    # The Rust crate yamc and yani depend on. Only the core crate is published;
    # the binding crate is publish = false and ships as the wheel.
    #
    # Needs a CARGO_REGISTRY_TOKEN repository secret, scoped to publish-update
    # for this crate. crates.io trusted publishing can replace it once the crate
    # exists, since the first version has to be published with a token.
    if: github.event_name == 'release'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radiological-material-clearance-finder
