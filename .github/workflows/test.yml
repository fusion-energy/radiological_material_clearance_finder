name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # The crate on its own, as yamc and yani link it, with no Python involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The wheel is abi3 for 3.10 and newer, so the oldest supported and the
        # newest two are what is worth running.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Not editable, so the tests import the built extension from
      # site-packages rather than the python/ source tree next to them.
      - name: Install
        run: python -m pip install .[test]

      # The package has no runtime dependencies, so this proves it stands alone.
      - name: Test without OpenMC
        run: pytest -q

  agreement:
    # Cross-checks the indexes against OpenMC's own waste_disposal_rating.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install with OpenMC
        run: |
          python -m pip install .[test]
          python -m pip install --extra-index-url https://shimwell.github.io/wheels openmc

      - name: Agreement tests
        run: pytest -q -m openmc
