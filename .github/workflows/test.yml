name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .[test]

      # The package has no runtime dependencies, so this proves it stands alone.
      - name: Test without OpenMC
        run: pytest -q

  agreement:
    # Cross-checks the indexes against OpenMC's own waste_disposal_rating.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with OpenMC
        run: |
          python -m pip install -e .[test]
          python -m pip install --extra-index-url https://shimwell.github.io/wheels openmc

      - name: Agreement tests
        run: pytest -q -m openmc
