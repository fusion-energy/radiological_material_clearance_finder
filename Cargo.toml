[workspace]
members = ["crates/*"]
# `cargo test` from the root runs the pure Rust crate only. The Python binding
# is a cdylib that links against libpython, and maturin is what builds it.
default-members = ["crates/radiological-material-clearance-finder"]
resolver = "2"

# One version for the crate and the wheel, which maturin reads from the binding
# crate, which inherits it from here. 0.0.0 is a placeholder: publish.yml runs
# tools/set_version.py to stamp the GitHub release tag's version in before it
# builds, so releasing v0.2.0 publishes 0.2.0 with nothing to bump by hand.
[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Jonathan Shimwell"]
repository = "https://github.com/fusion-energy/radiological_material_clearance_finder"
rust-version = "1.74"

[profile.release]
codegen-units = 1
lto = "thin"
# pyo3 turns a Rust panic into a Python exception by unwinding, so "abort" here
# would turn a recoverable error into a killed interpreter.
panic = "unwind"
