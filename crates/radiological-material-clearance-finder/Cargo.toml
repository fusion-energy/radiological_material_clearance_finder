[package]
name = "radiological-material-clearance-finder"
description = "Clearance indexes for radiological material against UK, German, US, EU and IAEA limit sets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["radiological", "clearance", "waste", "neutronics", "activation"]
categories = ["science"]
# The regulatory tables are compiled into the library with include_str!, so
# they have to travel with the crate.
include = ["src/**/*.rs", "data/**/*.json", "tests/**/*.rs", "README.md"]

[lib]
name = "radiological_material_clearance_finder"

# Deliberately small, and no pyo3: yamc and yani link this into their own
# material types, so anything heavy here would land in their builds too.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads OpenMC depletion chain files. Dependency free.
roxmltree = "0.21"
