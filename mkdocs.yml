site_name: radiological-material-clearance-finder
site_description: Clearance indexes for radiological material against UK, German, US, EU and IAEA limit sets
# The site is not live yet. GitHub Pages needs a paid plan for a private
# repository, so this is where it will be once the repo is public.
site_url: https://fusion-energy.github.io/radiological_material_clearance_finder/
repo_url: https://github.com/fusion-energy/radiological_material_clearance_finder
repo_name: fusion-energy/radiological_material_clearance_finder
edit_uri: edit/main/docs/
copyright: Copyright &copy; fusion-energy

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            docstring_section_style: list
            docstring_options:
              ignore_init_summary: true
              warn_missing_types: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            unwrap_annotated: true
            filters: public
            members_order: source
            summary: true
            heading_level: 2
            parameter_headings: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            show_bases: true
            relative_crossrefs: true
            scoped_crossrefs: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

watch:
  - python
  - crates/radiological-material-clearance-finder/src
  - README.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Limit sets: limit-sets.md
  - Regulatory notes: regulatory-notes.md
  - Using OpenMC: openmc.md
  - Using it from Rust: rust.md
  - Where the data comes from: data-provenance.md
  - API reference:
      - api/index.md
      - Material: api/material.md
      - Clearance index: api/clearance-index.md
      - Limit sets: api/limits.md
      - Classification: api/classify.md
      - Cooling: api/cooling.md
      - Decay data: api/decay.md
      - Nuclide names: api/nuclide.md
      - OpenMC interop: api/openmc_interop.md
