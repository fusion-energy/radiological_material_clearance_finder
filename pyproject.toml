[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "radiological-material-clearance-finder"
# The version lives in the workspace Cargo.toml, shared by the Rust crate and
# this wheel, and maturin reads it from there.
dynamic = ["version"]
description = "Clearance indexes for radiological material against UK, German, US, EU and IAEA limit sets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Shimwell" }]
keywords = ["radiological", "clearance", "waste", "neutronics", "activation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/fusion-energy/radiological_material_clearance_finder"

[tool.maturin]
manifest-path = "crates/radiological-material-clearance-finder-python/Cargo.toml"
python-source = "python"
module-name = "radiological_material_clearance_finder._core"
features = ["extension-module"]
# The sdist carries the test suite so the published artifact can be tested on
# its own, as publish.yml does.
include = [
    { path = "tests/**/*", format = "sdist" },
    { path = "tools/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
]
exclude = ["**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openmc: cross-check against an installed OpenMC (skipped when absent)",
    "network: re-downloads official regulatory sources",
]
